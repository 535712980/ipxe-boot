<style>body{font-family:system-ui,"Microsoft YaHei";max-width:760px;margin:40px auto;padding:0 16px;color:#222}

<body><h1>LaoWuPE iPXE Boot Source</h1>
<p class="ok">Service status: OK</p>
<p>iPXE 引导文件源。boot.wim 不在本机，走对象存储直链。</p>
<table><tr><th>路径</th><th>说明</th></tr>
<tr><td><code>/autoexec.ipxe</code></td><td>iPXE 启动脚本（EFI/BIOS 自动判断）</td></tr>
<tr><td><code>/boot/wimboot</code></td><td>wimboot 内核</td></tr>
<tr><td><code>/boot/boot.sdi</code></td><td>Boot SDI</td></tr>
<tr><td><code>/EFI/boot/bootx64.efi</code></td><td>UEFI 引导管理器</td></tr>
<tr><td><code>/bootmgr</code></td><td>BIOS 引导管理器</td></tr>
<tr><td><code>/ping.txt</code></td><td>保活探测用</td></tr>
</table></body></html>
