<h1>iPXE MBR 部署 - 文件下载</h1>
<p>目标保存位置：<code>X:\</code>（RAM盘）</p>
<p>依次点击下载以下文件，全部保存到 <code>X:\</code>：</p>
<a href="https://ipxe-boot.onrender.com/grldr">1. grldr</a>
<a href="https://ipxe-boot.onrender.com/menu.lst">2. menu.lst</a>
<a href="https://ipxe-boot.onrender.com/ipxe.lkrn">3. ipxe.lkrn</a>
<a href="https://ipxe-boot.onrender.com/grldr.mbr">4. grldr.mbr</a>
<a href="https://ipxe-boot.onrender.com/deploy-mbr.cmd">5. deploy-mbr.cmd</a>
<p class="warn">下载完成后关闭本页，回到命令提示符执行：</p>
<p><code>X:\deploy-mbr.cmd</code></p>
<p>脚本会把文件复制到 C:\，写入 grub4dos MBR，重启wpeutil reboot后进 iPXE 再拉 autoexec.ipxe。</p>
